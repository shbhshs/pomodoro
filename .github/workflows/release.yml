name: Release to TestFlight

# Turned off until the Apple account exists: set the repository variable
# RELEASE_ENABLED=true and add the secrets listed in fastlane/README.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      lane:
        description: fastlane lane to run
        type: choice
        options: [beta, signing]
        default: beta

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: macos-26
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - run: npm ci
      - run: npm run check
      - name: Generate the native iOS project
        run: npx expo prebuild --platform ios --clean
      - name: Run fastlane
        run: bundle exec fastlane ios ${{ inputs.lane || 'beta' }}
